<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PX MINERALS — Initialisation administrateur</title><link rel="icon" href="/app/favicon.svg"><link rel="stylesheet" href="/app/styles.css"></head><body class="auth-page"><main class="auth-card wide"><div class="auth-brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>PX<span>MINERALS</span></strong></div><p class="eyebrow">CONFIGURATION UNIQUE</p><h1>Créer le premier administrateur</h1><p class="auth-copy">Cette page ne peut être utilisée qu’une seule fois. Conservez la clé 2FA affichée à la fin dans votre application d’authentification.</p><form id="setup-form" class="form-grid"><label>Prénom<input id="firstName" required></label><label>Nom<input id="lastName" required></label><label>Pseudo administrateur<input id="username" pattern="[A-Za-z0-9_-]{3,32}" required></label><label>Numéro Wave<input id="waveNumber" inputmode="tel" minlength="8" required></label><label class="full">E-mail administrateur<input id="email" type="email" required></label><label>Mot de passe<input id="password" type="password" minlength="10" required></label><label>Confirmer le mot de passe<input id="passwordConfirmation" type="password" minlength="10" required></label><label class="full">Secret de configuration Netlify<input id="setupToken" type="password" minlength="24" required></label><button class="auth-submit full">Créer l’administrateur</button></form><p id="setup-message" class="auth-error"></p></main><script type="module" src="/admin/setup.js"></script></body></html>
