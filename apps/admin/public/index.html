<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f4e"><title>PX MINERALS — Administration</title><link rel="icon" href="/app/favicon.svg" type="image/svg+xml"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#102a52;font:14px Manrope,Arial}.shell{min-height:100vh;display:grid;grid-template-columns:255px 1fr}.side{background:#071f4e;color:#dcecff;padding:27px 17px}.brand{font:700 19px 'Space Grotesk';padding:8px 12px 33px}.brand span{color:#64aaff}.side small{display:block;color:#79a5d9;font:10px 'DM Mono';letter-spacing:1px;padding:0 12px 10px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#bfd4ee;padding:13px 12px;border-radius:8px;font:600 13px Manrope;cursor:pointer;margin:3px 0}.nav button:hover,.nav button.active{background:#1b478b;color:#fff}.main{padding:34px;max-width:1440px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.top p{margin:0;color:#6983a4;font:10px 'DM Mono';letter-spacing:1px}.top h1{margin:5px 0 0;font:700 27px 'Space Grotesk'}.logout,button{border:0;border-radius:7px;padding:10px 13px;background:#1265cd;color:#fff;font:700 11px Manrope;cursor:pointer}.logout{background:#edf3fb;color:#315579}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}.metric,.panel{background:#fff;border:1px solid #dfe8f3;border-radius:13px}.metric{padding:17px;color:#65809e;font-size:11px}.metric strong{display:block;color:#102a52;font:700 24px 'Space Grotesk';margin-top:6px}.panel{padding:21px;margin-top:18px}.panel h2{font:600 19px 'Space Grotesk';margin:0 0 4px}.panel p{color:#718ba8;font-size:12px}.table{width:100%;border-collapse:collapse;margin-top:15px}.table th{text-align:left;color:#7892ad;font:10px 'DM Mono';letter-spacing:.5px;padding:9px;border-bottom:1px solid #e5edf5}.table td{padding:12px 9px;border-bottom:1px solid #eef3f7;font-size:12px;vertical-align:top}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font:700 9px 'DM Mono';background:#edf3fb;color:#537293}.badge.active,.badge.completed{background:#e5f8ef;color:#14734b}.badge.pending{background:#fff3dd;color:#a36b10}.badge.blocked,.badge.refused{background:#ffebee;color:#b1334e}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{background:#b33b55}.muted{color:#7892ad}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.form input,.form select{width:100%;padding:11px;border:1px solid #d8e4f0;border-radius:7px;font:13px Manrope}.hidden{display:none}.auth{width:min(400px,calc(100% - 36px));margin:120px auto;background:#fff;border:1px solid #dfe8f3;border-radius:16px;padding:32px;box-shadow:0 18px 55px #12335b18}.auth h1{font:600 26px 'Space Grotesk';margin:8px 0}.auth input{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 13px;border:1px solid #ccd9e8;border-radius:7px}.auth .notice{color:#6a85a3;line-height:1.6;font-size:12px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{padding:14px}.brand{padding-bottom:10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.table{display:block;overflow:auto}}</style></head><body><div id="admin"></div><script type="module" src="/admin/app.js"></script></body></html>
