<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mot de passe oublié — PX MINERALS</title><link rel="stylesheet" href="/app/styles.css"></head><body><main class="auth-page"><section class="auth-card"><div class="auth-brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>PX<span>MINERALS</span></strong></div><p class="eyebrow">ACCÈS SÉCURISÉ</p><h1>Mot de passe oublié</h1><p class="auth-copy">Saisissez votre e-mail : nous vous enverrons un code de réinitialisation.</p><form id="request-form"><label for="email">Adresse e-mail</label><input id="email" type="email" autocomplete="email" required placeholder="vous@exemple.com"><button class="auth-submit" type="submit">Recevoir un code</button></form><form id="reset-form" hidden><label for="code">Code reçu par e-mail</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"><label for="password">Nouveau mot de passe</label><input id="password" type="password" autocomplete="new-password" required minlength="10"><label for="passwordConfirmation">Confirmer le mot de passe</label><input id="passwordConfirmation" type="password" autocomplete="new-password" required minlength="10"><button class="auth-submit" type="submit">Modifier mon mot de passe</button></form><p id="reset-message" class="auth-error" role="alert"></p><div class="auth-links"><a href="/app/login.html">Retour à la connexion</a></div></section></main><script type="module" src="/app/forgot-password.js"></script></body></html>
