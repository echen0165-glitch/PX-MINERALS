<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — PX MINERALS</title><link rel="icon" href="/app/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/app/styles.css"></head><body><main class="auth-page"><section class="auth-card wide"><div class="auth-brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>PX<span>MINERALS</span></strong></div><p class="eyebrow">BIENVENUE</p><h1>Créer un compte</h1><p class="auth-copy">Recevez 1 500 FCFA de bonus dès votre inscription.</p><form id="register-form" class="form-grid"><label>Prénom<input id="firstName" required maxlength="100"></label><label>Nom<input id="lastName" required maxlength="100"></label><label>Pseudo<input id="username" required pattern="[A-Za-z0-9_-]{3,32}" maxlength="32"></label><label>Date de naissance<input id="birthDate" type="date" required></label><label class="full">Choisir un avatar<select id="avatarKey"><option value="crystal">Cristal bleu</option><option value="iron">Fer</option><option value="gold">Or</option><option value="cobalt">Cobalt</option><option value="lithium">Lithium</option><option value="diamond">Diamant</option></select></label><label class="full">Numéro Wave<input id="waveNumber" required maxlength="32" placeholder="Ex. 0700000000"></label><label class="full">E-mail<input id="email" type="email" required></label><label>Mot de passe<input id="password" type="password" required minlength="10"></label><label>Confirmer le mot de passe<input id="passwordConfirmation" type="password" required minlength="10"></label><label class="full">Code de parrainage <small>(facultatif)</small><input id="referralCode" maxlength="32"></label><label class="terms full"><input id="terms" type="checkbox" required> J’accepte les conditions d’utilisation.</label><button class="auth-submit full" type="submit">Créer mon compte</button></form><p id="register-error" class="auth-error" role="alert"></p><div class="auth-links"><a href="/app/login.html">J’ai déjà un compte</a></div></section></main><script type="module" src="/app/register.js"></script></body></html>
