<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vérifier mon e-mail — PX MINERALS</title><link rel="stylesheet" href="/app/styles.css"></head><body><main class="auth-page"><section class="auth-card"><div class="auth-brand"><span class="brand-mark"><i></i><i></i><i></i></span><strong>PX<span>MINERALS</span></strong></div><p class="eyebrow">VÉRIFICATION</p><h1>Confirmez votre e-mail</h1><p class="auth-copy">Saisissez le code à 6 chiffres reçu par e-mail.</p><form id="verify-form"><label for="email">Adresse e-mail</label><input id="email" type="email" required><label for="code">Code de vérification</label><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="000000"><button class="auth-submit" type="submit">Activer mon compte</button></form><p id="verify-error" class="auth-error" role="alert"></p><button class="text-button" id="resend">Renvoyer un code</button></section></main><script type="module" src="/app/verify-email.js"></script></body></html>
