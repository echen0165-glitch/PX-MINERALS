services:
  - type: web
    runtime: node
    name: px-minerals
    plan: free
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_SSL
        value: true
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: WAVE_DEPOSIT_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_2FA_SECRET
        sync: false
