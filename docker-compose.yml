services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pxminerals
      POSTGRES_USER: pxminerals
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pxminerals -d pxminerals"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
